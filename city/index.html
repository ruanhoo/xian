<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Xi'an City · a living cartoon map of sights &amp; food</title>
  <meta name="description" content="Wander a tiny cartoon model of ancient Xi'an: the walled city, landmarks and street food in their real places, and little people eating their way around.">
  <meta name="theme-color" content="#58b9d6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AF%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="city.css">
</head>
<body>
  <canvas id="cv" role="img" data-i18n-aria="canvasAria" aria-label="Interactive illustrated map of the walled city of Xi'an"></canvas>

  <div id="logo" class="ui glass">
    <div class="big">XI'AN<br>CITY</div>
    <div class="sub"><b data-i18n="logoTag">Walled city</b><span data-i18n="logoSub">Sights + Food</span></div>
  </div>

  <div id="tod" class="ui glass" role="group" aria-label="Time of day"></div>

  <div id="tools" class="ui glass" role="toolbar">
    <button class="tb on" id="bLabel" aria-pressed="true"><span class="i">🏷️</span><span data-tool="labels">Labels</span></button>
    <button class="tb" id="bEmperor" aria-pressed="false"><span class="i">👑</span><span data-tool="emperor">Emperor</span></button>
    <button class="tb" id="bFollow" aria-pressed="false"><span class="i">🧍</span><span data-tool="follow">Follow</span></button>
    <button class="tb" id="bPause" aria-pressed="false"><span class="i" id="pauseIcon">⏸</span><span id="pauseTx" data-tool="pause">Pause</span></button>
    <button class="tb" id="bBird" aria-pressed="false"><span class="i">🛰️</span><span data-tool="bird">Bird's-eye</span></button>
    <button class="tb" id="bPlan" aria-pressed="false"><span class="i">🗺️</span><span data-tool="plan">Route</span></button>
    <button class="tb" id="bLog" aria-pressed="false"><span class="i">📒</span><span data-tool="log">Journal</span></button>
  </div>

  <div id="right" class="ui">
    <div class="lang" role="group" data-i18n-aria="langAria" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="zh" aria-pressed="false">中文</button>
    </div>
    <button class="tb" id="bAll" data-i18n="overview">↗ Overview</button>
    <button class="tb" id="bList" data-i18n="list" aria-expanded="false">☰ List</button>
    <button class="tb" id="bHelp" aria-label="Help">?</button>
    <a class="tb" id="bClassic" href="../index.html" data-i18n="classic">🗺️ Classic map</a>
  </div>

  <div id="follow" class="ui glass" aria-live="polite"></div>

  <div id="decree" class="ui glass"><b data-i18n="decreeTitle">👑 Emperor's latest decree</b><span id="decreeTx"></span></div>

  <aside id="drawer" class="ui glass" aria-label="Places">
    <input id="q" type="search" data-i18n-ph="search" placeholder="🔍 Search places, notes…" autocomplete="off">
    <div id="cats"></div>
    <div id="list"></div>
  </aside>

  <aside id="log" class="ui glass"><h5 data-i18n="logTitle">City journal</h5><div id="logs" aria-live="off"></div></aside>

  <section id="card" class="ui glass" aria-live="polite"></section>

  <aside id="plan" class="ui glass" aria-label="Route planner">
    <div class="ph"><b data-i18n="planTitle">🗺️ Route planner</b><button id="pclose" type="button" aria-label="Close">×</button></div>
    <div class="pset">
      <label><span data-i18n="pStart">Start time</span><input type="time" id="pTime" value="09:30"></label>
      <label><span data-i18n="pFrom">Start from</span><select id="pFrom"></select></label>
      <label><span data-i18n="pMode">Travel</span><select id="pMode"></select></label>
      <label><span data-i18n="pPace">Pace</span><select id="pPace"></select></label>
    </div>
    <div class="pbar"><span id="pCount"></span><span><button class="btn" id="pFav" type="button" data-i18n="useFavs">⭐ Add favorites</button> <button class="btn" id="pClear" type="button" data-i18n="clear">Clear</button></span></div>
    <div id="pList"></div>
    <div class="pgo"><button class="btn pri" id="pGo" type="button" data-i18n="go">✨ Auto-plan route</button></div>
    <div id="pOut" aria-live="polite"></div>
    <p class="pnote" id="pNote"></p>
  </aside>

  <div id="intro" class="ui" role="dialog" aria-modal="true" aria-labelledby="iti">
    <div class="box glass">
      <div class="st" id="ist"></div><h2 id="iti"></h2><p id="itx"></p>
      <div class="row"><div class="dots" id="idt"></div><div><button class="btn" id="iskip" type="button"></button> <button class="btn pri" id="inext" type="button"></button></div></div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="strings.js"></script>
  <script src="teleport.js"></script>
  <script src="city.js"></script>
</body>
</html>
